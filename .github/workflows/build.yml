name: Build Piwigo Flutter App

on:
  push:
    branches: [ my-dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4' # Phiên bản Flutter tương thích

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: piwigo-app
          path: build/app/outputs/flutter-apk/app-release.apk